<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4338ca" />
    <meta
      name="description"
      content="NoticeMate — An independent platform that simplifies and assists users to understand any government or private notice, official letter, or bill."
    />
    <title>NoticeMate — Simplify & Understand Any Government or Private Notice</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to main content</a>

    <!-- Demo mode banner -------------------------------------------------->
    <div class="demo-banner" role="note">
      <span class="demo-banner__dot" aria-hidden="true"></span>
      <span data-i18n="demo.banner"
        >DEMO PROTOTYPE — NOT AN OFFICIAL GOVERNMENT SERVICE</span
      >
    </div>

    <!-- App header -------------------------------------------------------->
    <header class="app-header">
      <a class="brand" href="#/" aria-label="NoticeMate home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <path
              d="M6 3h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"
              stroke="currentColor"
              stroke-width="1.6"
            />
            <path d="M13 3v5h5" stroke="currentColor" stroke-width="1.6" />
            <path
              d="m8.5 14 2 2 4-4.5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span class="brand__name">Notice<strong>Mate</strong></span>
      </a>

      <div class="header-actions">
        <label class="lang-select" title="Language">
          <span class="lang-select__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" />
              <path
                d="M3 12h18M12 3c2.5 2.5 2.5 15.5 0 18M12 3c-2.5 2.5-2.5 15.5 0 18"
                stroke="currentColor"
                stroke-width="1.4"
              />
            </svg>
          </span>
          <select id="lang" aria-label="Select language">
            <option value="en">English</option>
            <option value="hi">हिन्दी</option>
            <option value="te">తెలుగు</option>
          </select>
        </label>
      </div>
    </header>

    <!-- Main SPA mount ---------------------------------------------------->
    <main id="main" class="app-main" tabindex="-1"></main>

    <!-- Footer ------------------------------------------------------------>
    <footer class="app-footer">
      <p data-i18n="footer.disclaimer">
        NoticeMate is a hackathon prototype and is not an official government
        service. All notices and data shown are synthetic.
      </p>
      <p class="app-footer__meta">
        <span data-i18n="footer.privacy"
          >Your information stays on this demo. No data is sent to any government
          system.</span
        >
      </p>
    </footer>

    <!-- Toast / live region for status messages -------------------------->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js?v=25"></script>
  </body>
</html>
